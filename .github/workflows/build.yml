name: Build Redmi Note 11 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev git python2 python3 gcc g++ wget tar

    - name: Download Toolchains
      run: |
        # Proton Clang aur Android GCC 4.9 Binutils
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Update Makefile and Defconfig Parameters
      run: |
        sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 157/' Makefile
        sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile

        # Sahi Performance Defconfig Select Karein
        DEFCONFIG=""
        for config in vendor/spes-perf_defconfig vendor/spes_defconfig spes-perf_defconfig spes_defconfig; do
          if [ -f "arch/arm64/configs/$config" ]; then
            DEFCONFIG="$config"
            break
          fi
        done
        echo "DEFCONFIG_NAME=$DEFCONFIG" >> $GITHUB_ENV

        # Custom Localversion (-Sitanshu)
        echo "CONFIG_LOCALVERSION=\"-Sitanshu\"" >> "arch/arm64/configs/$DEFCONFIG"

        # Disable Module Signature Verification
        sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/' "arch/arm64/configs/$DEFCONFIG" || true
        sed -i 's/CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/' "arch/arm64/configs/$DEFCONFIG" || true
        sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/' "arch/arm64/configs/$DEFCONFIG" || true
        echo "CONFIG_MODULE_SIG=n" >> "arch/arm64/configs/$DEFCONFIG"
        echo "# CONFIG_MODULE_SIG_ALL is not set" >> "arch/arm64/configs/$DEFCONFIG"

    - name: Build Kernel
      run: |
        export PATH=$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:/usr/bin:$PATH
        
        MAKE_ARGS=(
          O=out
          ARCH=arm64
          SUBARCH=arm64
          CC=clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-android-
          CROSS_COMPILE_ARM32=arm-linux-androideabi-
          LOCALVERSION="-Sitanshu"
          KCFLAGS="-Wno-error"
          KCPPFLAGS="-Wno-error"
        )

        make "${MAKE_ARGS[@]}" "$DEFCONFIG_NAME"
        make -j$(nproc) "${MAKE_ARGS[@]}"

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Redmi-Note-11-Kernel-Image
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dt*
          
